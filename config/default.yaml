# All paths are relative to the repository root unless absolute.
paths:
  raw_status_changes: raw data        # one <YYYY-MM>.rar per month
  interim: data/interim
  processed: data/processed

# GIS layers (.zip archives are read in place). null = not available.
layers:
  city_boundary: data/layers/city_boundary.zip
  taz: data/layers/taz.zip
  areas: data/layers/areas.zip
  bike_lanes: data/layers/bike_lanes.zip
  docking_stations: data/layers/docking_stations.zip
  neighbourhoods: null
  open_space: null

# Projected CRS used for every metric operation (Israel Transverse Mercator)
crs:
  geographic: EPSG:4326
  projected: EPSG:2039

study:
  start: "2024-01-01"
  end: "2025-01-01"
  vehicle_type: scooter

# Same values as the thesis pipeline (sdes-cycling-infrastructure).
parking:
  same_location_m: 25
  merge_gap_s: 300
  low_battery_window_s: 600
  min_duration_s: 5
  open_space_buffer_m: 2.5

partitioning:
  n_buckets: 64               # vehicle partitions; one is held in memory at a time

panel:
  cell_size_m: 100            # square grid in the projected CRS
  docking_buffer_m: 10        # GPS tolerance around docking polygons
  depot_min_events: 200       # a cell is depot-like if it has at least this many events...
  depot_min_provider_share: 0.5  # ...and at least this share of them are operator drop-offs

# Target hours. Training starts a week after the warm-up so that weekly lags are valid.
splits:
  warmup_end: "2024-01-22"
  train_start: "2024-01-29"
  tune_start: "2024-09-01"
  test_start: "2024-11-01"
  test_end: "2024-12-29"

forecast:
  horizons: [1, 3, 6]         # hours ahead reported in the evaluation
  max_horizon: 6
  levels: [10, 20, 40]        # elevated, high, severe (scooters per cell)
  min_active_peak: 5          # a cell is modelled if it reached this count during training

weather:
  latitude: 32.08
  longitude: 34.78
