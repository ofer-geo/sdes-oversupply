[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdes-oversupply"
version = "0.1.0"
description = "Forecasting shared e-scooter oversupply in Tel Aviv-Yafo's public space"
authors = [{ name = "Ofer Shahal" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "pandas>=3.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "orjson>=3.9",
    "pyyaml>=6",
    "scipy>=1.11",
    "holidays>=0.50",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
nn = ["torch>=2.6"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD"]
ignore = [
    "PD011",  # .values on geometry columns returns a GeometryArray, as intended
]

[tool.pytest.ini_options]
testpaths = ["tests"]
